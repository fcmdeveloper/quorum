plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tangemnfc'
version = '1.0.0'

// Versión del SDK Android de Tangem (JitPack). Si Tangem publica una nueva,
// cámbiala aquí y revisa los imports de TangemNfcModule.kt.
def tangemSdkVersion = project.findProperty('tangemSdkVersion') ?: '3.6.2'

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

android {
  namespace "expo.modules.tangemnfc"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.github.tangem.tangem-sdk-android:android:${tangemSdkVersion}"
  implementation "com.github.tangem.tangem-sdk-android:core:${tangemSdkVersion}"
}
