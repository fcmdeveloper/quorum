plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tangemnfc'
version = '1.0.0'

// Versión del SDK Android de Tangem (JitPack): la misma que usa Xaman en tangem-sdk-react-native.
// Si se cambia, revisar los imports y el constructor de TangemSdk en TangemNfcModule.kt.
def tangemSdkVersion = project.findProperty('tangemSdkVersion') ?: '3.9.2'

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

android {
  namespace "expo.modules.tangemnfc"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.github.tangem.tangem-sdk-android:android:${tangemSdkVersion}"
  implementation "com.github.tangem.tangem-sdk-android:core:${tangemSdkVersion}"
}
