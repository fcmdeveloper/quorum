plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tangemnfc'
version = '1.0.0'

// SDK Android de Tangem desde JitPack, fijado a un commit del repositorio tangem/tangem-sdk-android
// (Tangem ya no publica tags: JitPack lo compila desde ese commit). 66c17201bc = master del
// 12 oct 2026, versión 3.9.2. Si se cambia, revisar el constructor de TangemSdk en TangemNfcModule.kt.
def tangemSdkVersion = project.findProperty('tangemSdkVersion') ?: '66c17201bc'

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

android {
  namespace "expo.modules.tangemnfc"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.github.tangem.tangem-sdk-android:android:${tangemSdkVersion}"
  implementation "com.github.tangem.tangem-sdk-android:core:${tangemSdkVersion}"
  // Tangem SDK las usa por dentro, pero no las expone: el módulo las necesita para su actividad
  implementation "androidx.activity:activity-ktx:1.10.1"
  implementation "androidx.fragment:fragment-ktx:1.8.6"
  implementation "com.google.android.material:material:1.12.0"
  implementation "androidx.appcompat:appcompat:1.7.0"
}
